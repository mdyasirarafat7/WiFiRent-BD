version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wifirent-postgres
    environment:
      POSTGRES_DB: wifirent_bd
      POSTGRES_USER: wifirent
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - wifirent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifirent -d wifirent_bd"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wifirent-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wifirent_bd
      DB_USERNAME: wifirent
      DB_PASSWORD: changeme
      JWT_SECRET: change-me-in-production-at-least-32-random-chars
      CORS_ALLOWED_ORIGINS: http://localhost:*
      GATEWAY_MODE: mock
      PAYMENT_MODE: mock
    ports:
      - "8080:8080"
      - "8081:8081"
    restart: unless-stopped

volumes:
  wifirent_postgres_data:
