spring.application.name=wifirent-bd-backend

# Datasource (H2 in-memory for demo - no PostgreSQL required)
spring.datasource.url=${DB_URL:jdbc:h2:mem:wifirent_bd;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.timezone=UTC
spring.jpa.properties.hibernate.timezone=UTC

# Flyway (disabled for H2 demo - Hibernate creates schema)
spring.flyway.enabled=false

# Server
server.port=8080
server.servlet.context-path=

# JWT
app.jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# BDT / timezone
app.timezone=Asia/Dhaka
app.currency=BDT

# Actuator (restricted)
management.endpoints.web.exposure.enabled=health,info
management.endpoint.health.show-details=never
management.server.port=8081

# CORS (dev-friendly, restrict in prod)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Webhook security
app.webhook.secret=${WEBHOOK_SECRET:change-me-in-production}

# Scheduler
app.scheduler.expiration-delay-ms=60000

# Demo wallet configuration (virtual credits only, no real money)
app.wallet.initial-demo-balance=5000
app.wallet.platform-commission-rate-bps=100

# Enable detailed error messages for demo
server.error.include-stacktrace=always
server.error.include-message=always
