spring.datasource.url=jdbc:h2:mem:wifirent_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.timezone=UTC
spring.jpa.properties.hibernate.timezone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=8080
server.servlet.context-path=/api

app.jwt.secret=test-secret-key-not-for-production-use
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

app.timezone=Asia/Dhaka
app.currency=BDT

management.endpoints.web.exposure.enabled=health,info
management.endpoint.health.show-details=never

app.webhook.secret=test-webhook-secret
app.scheduler.expiration-delay-ms=60000
app.wallet.initial-demo-balance=5000
app.wallet.platform-commission-rate-bps=100

app.cors.allowed-origins=http://localhost:*
